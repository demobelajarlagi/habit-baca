<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBEF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Habit Baca</title>
<style>
:root{
  --bg:#FFFBEF; --card:#FFFFFF; --ink:#473C33; --muted:#7A6D62; --line:#EFE6D2;
  --green:#ABC270; --green-soft:#E4EDC4; --yellow:#FEC868; --yellow-soft:#FFF1CF; --orange:#FDA769;
  --accent:#FDA769; --soft:#F6EEDB; --warn:#A8501C; --ok:#4C6A12; --dot:#7E9A3A;
  --on-color:#473C33; --cream:#FFFBEF; --input-bg:#FFFBEF;
  --today-bg:#473C33; --today-ink:#FFFBEF; --quest-bg:#FFF1CF;
  --navon-bg:#E4EDC4; --navon-ink:#473C33; --muted-q:#6F6358; --banner-ink:#FFFFFF;
  color-scheme:light;
  --shadow:0 6px 20px rgba(71,60,51,.08); --shadow-nav:0 10px 30px rgba(71,60,51,.18);
  --shadow-orange:0 8px 20px rgba(253,167,105,.5);
}
:root[data-view="timer"]{
  --bg:#2B2420; --card:#362E28; --ink:#FFFBEF; --muted:#C2B6A8; --line:#4A3F37; --soft:#40372F; --input-bg:#2B2420;
  --warn:#FDA769; --banner-ink:#2B2420; color-scheme:dark;
}
:root[data-view="timer"] body{padding-bottom:16px}
:root[data-view="finish"] body{padding-bottom:28px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500;line-height:1.45}
body{padding:16px 16px calc(108px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font-size:1.4rem;font-weight:700;margin:4px 0 14px}
h2{font-size:1.08rem;font-weight:700;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.ic{width:22px;height:22px;flex:0 0 auto}
.bar{height:14px;background:var(--soft);border-radius:99px;overflow:hidden;margin:10px 0 6px;box-shadow:inset 0 0 0 1px var(--line)}
.bar>i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .4s}
label{display:block;font-size:.88rem;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-weight:500;font-size:16px;padding:12px 14px;min-height:48px;border-radius:16px;border:1px solid var(--line);background:var(--input-bg);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
button{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:16px;padding:14px 16px;cursor:pointer;background:var(--soft);color:var(--ink);min-height:48px}
button.primary{background:var(--orange);color:var(--on-color);font-weight:700;width:100%}
button.danger{background:transparent;color:var(--warn);min-height:44px;padding:8px 10px}
button.small{min-height:44px;padding:8px 12px;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;min-height:44px;border:1px solid var(--line);background:var(--input-bg);border-radius:999px}
.chip.on{background:var(--green);color:var(--on-color);border-color:var(--green)}
.badge{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft)}
.badge.ok{color:var(--ok)} .badge.no{color:var(--warn)}
nav{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;display:flex;gap:4px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow-nav);z-index:5}
nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;background:transparent;min-height:52px;padding:0 8px;color:var(--muted);font-size:.86rem;font-weight:600}
nav button.on{background:var(--navon-bg);color:var(--navon-ink);font-weight:700}
.help ol{margin:8px 0 0;padding-left:22px}.help li{margin:6px 0}
.helpchip{display:inline-flex;align-items:center;gap:8px;background:var(--yellow-soft);color:var(--on-color);border:1px solid var(--line);border-radius:999px;min-height:44px;padding:8px 16px 8px 12px;font-size:.92rem;font-weight:700}
.helpchip .ic{width:20px;height:20px}
.notice{background:var(--soft);color:var(--ink);border-radius:16px;padding:10px 14px;margin-bottom:10px;font-size:.92rem}
.err{color:var(--warn);font-size:.9rem;font-weight:600;margin:8px 0 0}
.banner{background:var(--warn);color:var(--banner-ink);padding:10px 14px;border-radius:16px;margin-bottom:12px;font-size:.9rem}
.sess{padding:10px 0;border-top:1px solid var(--line)}
.sess:first-child{border-top:0}
.note{white-space:pre-wrap;margin-top:4px}
.dayh{font-weight:700;margin:14px 0 6px}
button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
/* riwayat */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.st{border-radius:20px;padding:12px 8px;text-align:center;color:#473C33}
.st b{display:block;font-size:22px;font-weight:700;line-height:1.2}
.st span{display:block;font-size:.76rem;font-weight:600;color:#5E5248}
.st.g{background:#E4EDC4}.st.y{background:#FFF1CF}.st.o{background:#FFE3CF}
.card .sub{font-size:.82rem;font-weight:600;color:var(--muted);margin:-4px 0 0}
.mapgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:14px 0}
.mc{aspect-ratio:1/1;border-radius:8px}
.mc.missed{background:#EDE4CF}
.mc.future{border:2px dashed #D2C5AB}
.mc.today,.mc.todayon{box-shadow:inset 0 0 0 2.5px #473C33}
.mc.today{background:#FFFBEF}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;font-weight:600;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block;flex:0 0 auto}
.sw.missed{background:#EDE4CF}.sw.fut{border:1.5px dashed #D2C5AB}.sw.now{background:#FFFBEF;box-shadow:inset 0 0 0 2.5px #473C33}
.plot{position:relative;height:124px;margin-top:12px}
.bars{display:flex;gap:8px;height:100%;align-items:flex-end}
.bcol{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bval{font-size:.8rem;font-weight:700;line-height:1}
.bfill{display:block;width:100%;max-width:36px;border-radius:10px 10px 6px 6px;background:var(--green)}
.bcol.today .bfill{background:var(--orange)}
.bzero{display:block;width:8px;height:8px;border-radius:50%;background:#E9DFC6}
.tline{position:absolute;left:0;right:0;border-top:2px dashed #8A7C6F;pointer-events:none}
.blabels{display:flex;gap:8px;margin-top:6px}
.blabels span{flex:1;min-width:0;text-align:center;font-size:.78rem;font-weight:600;color:var(--muted)}
.blabels .now{color:var(--ink);font-weight:700}
.tleg{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.78rem;font-weight:600;color:var(--muted)}
.tdash{width:22px;border-top:2px dashed #8A7C6F;display:inline-block}
.sech{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 2px 10px}
.sech h2{margin:0}
.sech select{width:auto;max-width:60%;min-height:44px;padding:8px 12px}
.scard{padding:14px 16px;margin-bottom:10px}
.smeta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--muted);font-size:.88rem;font-weight:600;margin-top:4px}
.empty{text-align:center;padding:22px 16px}
.empty .mascot{flex:none;width:84px;height:84px;margin:0 auto 8px}
.empty p{margin:0;font-weight:700}
/* buku */
.bcard h2{margin:0;font-size:1.1rem}
.bcard .bar{height:12px;margin:12px 0 8px}
.stchip{flex:0 0 auto;padding:5px 12px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--soft);color:var(--ink)}
.stchip.read{background:var(--yellow-soft);border:1px solid var(--line)}
.stchip.done{background:var(--green);color:#473C33}
details.addbook{margin-bottom:12px}
details.addbook>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:999px;background:var(--orange);color:var(--on-color);font-weight:700;font-size:1.1rem;box-shadow:var(--shadow-orange);margin-bottom:12px}
details.addbook>summary::-webkit-details-marker{display:none}
details.addbook .card{margin-bottom:0}
/* beranda */
.hdate{font-size:.85rem;font-weight:600;color:var(--muted);margin:6px 0 0}
.greet{font-size:1.75rem;font-weight:700;letter-spacing:-.3px;margin:2px 0 14px}
.strip{display:flex;gap:6px;margin-bottom:14px}
.day{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;border-radius:20px;color:var(--muted);font-weight:600}
.day .dn{font-size:.72rem}
.day b{font-size:1.08rem;font-weight:700;color:var(--ink)}
.day .dot{width:6px;height:6px;border-radius:50%;margin-top:3px;background:transparent}
.day .dot.on{background:var(--dot)}
.day.today{background:var(--today-bg);color:var(--today-ink)}
.day.today b{color:var(--today-ink)}
.day.today .dot.on{background:var(--green)}
.hero{background:var(--green);color:var(--on-color);border-radius:28px;padding:18px 16px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero-top{display:flex;align-items:center;gap:14px}
.mascot{flex:0 0 100px;height:100px}
.mascot svg{width:100%;height:100%;display:block;overflow:visible;animation:bob 3.2s ease-in-out infinite}
.bubble{position:relative;flex:1;background:var(--cream);color:var(--on-color);border-radius:22px;padding:12px 14px;font-weight:700;font-size:1.02rem;line-height:1.3}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:var(--cream)}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.62);color:var(--on-color);border-radius:999px;padding:7px 13px;font-weight:700;font-size:.92rem}
.pill .ic{width:18px;height:18px}
.gift{font-size:.82rem;font-weight:600;color:var(--muted);margin:0}
.countdown{font-size:1.5rem;font-weight:700;letter-spacing:-.3px}
.quest{display:flex;align-items:center;gap:12px;background:var(--quest-bg);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.qicon{flex:0 0 46px;height:46px;border-radius:50%;background:var(--yellow);color:#473C33;display:flex;align-items:center;justify-content:center}
.qbody{flex:1;min-width:0}
.qt{font-weight:700}
.quest .muted{color:var(--muted-q)}
.qchip{flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:.82rem;font-weight:700;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.qchip.on{background:var(--green);color:#473C33;border-color:var(--green)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:999px;font-size:1.1rem;box-shadow:var(--shadow-orange);margin-top:2px}
.cta .ic{width:22px;height:22px}
/* timer */
.timerwrap{min-height:calc(100vh - 32px);min-height:calc(100dvh - 32px);display:flex;flex-direction:column;justify-content:center;align-items:stretch;text-align:center;gap:14px}
.t-head h2{margin:0;font-size:1.15rem}
.ring{--rs:min(calc(100vw - 56px),340px,42vh);width:var(--rs);height:var(--rs);margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tdig{font-family:"Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:calc(var(--rs) * .24);font-weight:600;line-height:.8;font-variant-numeric:tabular-nums;white-space:nowrap}
.tdig .d{display:inline-block;width:.62em;text-align:center}
.tdig .c{display:inline-block;width:.26em;text-align:center}
.tdig.long{font-size:calc(var(--rs) * .15)}
.ring .t .muted{margin-top:6px}
.t-buddy{display:flex;align-items:center;justify-content:center;gap:12px}
.t-buddy .mascot{flex:0 0 84px;height:84px}
.mascot.breath svg{animation:breathe 4.2s ease-in-out infinite;transform-origin:50% 92%}
.bubble.sm{flex:0 1 auto;max-width:210px;font-size:.92rem;padding:10px 14px;text-align:left}
button.outline{background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:999px;min-height:48px;padding:10px 16px;font-weight:700}
@media (max-height:700px){.t-buddy .mascot{flex-basis:64px;height:64px}.timerwrap{gap:10px}}
.big{font-size:clamp(3rem,16vw,4.6rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px}
/* selesai membaca */
.fin-head{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.fin-head h1{margin:0}
.fin-head .mascot{flex:0 0 76px;height:76px}
.textbtn{display:block;width:100%;background:transparent;color:var(--ink);min-height:44px;font-weight:700;margin-top:6px}
/* modal + perayaan */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .card{max-width:420px;width:100%;margin:0}
.modal button{width:100%;margin-top:8px}
.modal.celebrate-modal{background:#FEC868;padding:0;align-items:stretch;overflow-y:auto}
.celebrate-modal .card{max-width:none;background:transparent;border:0;box-shadow:none;border-radius:0;padding:28px 22px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;color:#473C33}
.cel-confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cel-body{position:relative;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:10px}
.cel-bubble{position:relative;background:#FFFBEF;color:#473C33;border-radius:22px;padding:10px 20px;font-weight:700;font-size:1.1rem}
.cel-bubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#FFFBEF}
.cel-mascot{width:min(46vw,190px);height:min(46vw,190px);margin:12px 0 4px}
.cel-mascot svg{width:100%;height:100%;display:block;overflow:visible;animation:hop 1.6s ease-in-out infinite;transform-origin:50% 100%}
.cel-title{font-size:1.7rem;font-weight:700;margin:0;letter-spacing:-.3px;color:#473C33}
.cel-sub{margin:0 0 10px;font-weight:600;font-size:1rem;color:#473C33}
.celebrate-modal button{margin-top:0;width:100%;min-height:56px;border-radius:999px;font-weight:700;font-size:1.05rem}
.celebrate-modal .cel-main{background:#473C33;color:#FFFBEF}
.celebrate-modal .cel-alt{background:#FEC868;color:#473C33;border:2px solid #473C33;min-height:48px;margin-top:2px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}12%{transform:translateY(0) scaleY(.94)}45%{transform:translateY(-24px) scaleY(1.03)}75%{transform:translateY(0) scaleY(1)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<nav id="nav" aria-label="Menu utama"></nav>

<script>
'use strict';
/* ====== Konfigurasi ====== */
var BIRTHDAY = '2026-12-18';
var TARGET_DAYS = 30;     // syarat hadiah
var TARGET_BOOKS = 4;
var KEY = 'habitbaca.v1';
var GOALS = [5, 10, 15, 30];

/* ====== Tanggal ====== */
function dkey(ms){var d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dnum(k){var p=k.split('-');return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/86400000);}

/* ====== Logika murni (diuji terpisah) ====== */
function activeDates(sessions){var s={};sessions.forEach(function(x){s[x.date]=1;});return Object.keys(s).sort();}
function levelFor(n){return n<=3?{lv:1,min:5}:n<=14?{lv:2,min:10}:n<=30?{lv:3,min:15}:{lv:4,min:30};}
function todayInfo(sessions,today){
  var dates=activeDates(sessions), isActive=dates.indexOf(today)>=0;
  var idx=isActive?dates.indexOf(today)+1:dates.length+1;
  var L=levelFor(idx);
  var met=sessions.some(function(x){return x.date===today&&x.durationSec>=L.min*60;});
  return {dates:dates,isActive:isActive,idx:idx,lv:L.lv,goalMin:L.min,met:met,bonus:idx>TARGET_DAYS};
}
// Bolos 1 hari dimaafkan; bolos 2 hari berturut-turut mereset ke 0.
function streak(dates,today){
  if(!dates.length)return 0;
  var last=dates[dates.length-1];
  if(dnum(today)-dnum(last)>2)return 0;
  var n=1;
  for(var i=dates.length-1;i>0;i--){
    if(dnum(dates[i])-dnum(dates[i-1])<=2)n++;else break;
  }
  return n;
}
function bookProgress(book,sessions){
  var m=0;sessions.forEach(function(s){if(s.bookId===book.id&&s.endPage>m)m=s.endPage;});
  return m;
}
function lastEnd(bookId,sessions){
  var l=null;sessions.forEach(function(s){if(s.bookId===bookId&&(!l||s.endedAt>l.endedAt))l=s;});
  return l?l.endPage:1;
}
function elapsedMs(a,now){return Math.max(0,(a.stoppedAt||now)-a.startedAt-(a.pausedMs||0));}
function fmt(ms){
  var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
  var p=function(x){return String(x).padStart(2,'0');};
  return (h?h+':':'')+p(m)+':'+p(sec);
}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var DAY=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
function prettyDate(k){var p=k.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);return DAY[d.getDay()]+', '+(+p[2])+' '+MON[+p[1]-1]+' '+p[0];}

if(typeof module!=='undefined')module.exports={dkey:dkey,dnum:dnum,activeDates:activeDates,levelFor:levelFor,todayInfo:todayInfo,streak:streak,bookProgress:bookProgress,lastEnd:lastEnd,elapsedMs:elapsedMs,fmt:fmt};

/* ====== Penyimpanan ====== */
var storageOK=true;
function emptyDb(){return {books:[],sessions:[],active:null};}
function load(){
  try{
    localStorage.setItem('hb.test','1');localStorage.removeItem('hb.test');
    var r=localStorage.getItem(KEY);
    if(r){var d=JSON.parse(r);return {books:d.books||[],sessions:d.sessions||[],active:d.active||null};}
  }catch(e){storageOK=false;}
  return emptyDb();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){storageOK=false;}
}
var db=emptyDb();

/* ====== State UI ====== */
var ui={view:'home',goal:null,bookId:null,startPage:null,histBook:'',err:'',notice:'',help:false};
var tickTimer=null,wakeLock=null,reachedShown=false;
var $app,$nav,$modal;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function bookById(id){return db.books.filter(function(b){return b.id===id;})[0];}
function openBooks(){return db.books.filter(function(b){return bookProgress(b,db.sessions)<b.total;});}
function finishedCount(){return db.books.filter(function(b){return bookProgress(b,db.sessions)>=b.total;}).length;}

/* ====== Wake Lock, bunyi, getar ====== */
function getLock(){
  try{
    if(navigator.wakeLock&&!wakeLock){
      navigator.wakeLock.request('screen').then(function(l){wakeLock=l;l.addEventListener('release',function(){wakeLock=null;});}).catch(function(){});
    }
  }catch(e){}
}
function dropLock(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
var actx=null;
function unlockAudio(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!actx&&AC)actx=new AC();
    if(actx&&actx.state==='suspended')actx.resume();
  }catch(e){}
}
function beep(){
  try{
    if(!actx)return;
    for(var i=0;i<3;i++){
      var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*0.45;
      o.frequency.value=880;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.4,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.32);
    }
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([300,120,300,120,300]);}catch(e){}
}

/* ====== Aksi ====== */
function startSession(){
  var bookId=ui.bookId,b=bookById(bookId);
  var sp=parseInt(ui.startPage,10);
  if(!b){ui.err='Pilih buku dulu.';return render();}
  if(!(sp>=1)||sp>b.total){ui.err='Start page harus antara 1 dan '+b.total+'.';return render();}
  var now=Date.now();
  db.active={bookId:bookId,startPage:sp,goalMin:ui.goal,startedAt:now,pausedMs:0,lastSeen:now,goalHandled:false,stoppedAt:null};
  save();unlockAudio();getLock();ui.err='';ui.notice='';reachedShown=false;
  ui.view='timer';render();
}
function stopSession(){
  if(!db.active)return;
  db.active.stoppedAt=Date.now();db.active.lastSeen=db.active.stoppedAt;save();
  dropLock();stopTick();closeModal();
  ui.err='';ui.view='finish';render();
}
function discardSession(){
  if(!confirm('Buang sesi ini? Waktu baca tidak akan dicatat.'))return;
  db.active=null;save();dropLock();stopTick();closeModal();ui.view='home';render();
}
function submitSession(){
  var a=db.active,b=a&&bookById(a.bookId);
  if(!a||!b)return;
  var ep=parseInt(document.getElementById('endp').value,10);
  var note=document.getElementById('note').value.trim();
  if(!(ep>=a.startPage)){ui.err='End page tidak boleh lebih kecil dari start page ('+a.startPage+').';return render();}
  if(ep>b.total){ui.err='End page melebihi total halaman buku ('+b.total+').';return render();}
  var info=todayInfo(db.sessions,dkey(Date.now()));
  db.sessions.push({
    id:uid(),bookId:a.bookId,date:dkey(Date.now()),startedAt:a.startedAt,endedAt:a.stoppedAt,
    durationSec:Math.round(elapsedMs(a,a.stoppedAt)/1000),startPage:a.startPage,endPage:ep,note:note,
    goalMin:a.goalMin,questGoalMin:info.goalMin
  });
  var done=ep>=b.total;
  db.active=null;save();ui.err='';ui.view='home';ui.bookId=null;ui.startPage=null;ui.goal=null;
  render();
  if(done)showModal('<h2>Buku selesai! 🎉</h2><p>"'+esc(b.title)+'" tamat. Selamat!</p><button class="primary" data-a="closeModal">Lanjut</button>');
}
function addBook(){
  var t=document.getElementById('bt').value.trim(),n=parseInt(document.getElementById('bn').value,10);
  if(!t){ui.err='Judul buku harus diisi.';return render();}
  if(!(n>=1)){ui.err='Total halaman harus angka 1 atau lebih.';return render();}
  var dup=db.books.some(function(b){return b.title.toLowerCase()===t.toLowerCase();});
  if(dup){ui.err='Buku dengan judul itu sudah ada.';return render();}
  var b={id:uid(),title:t,total:n,createdAt:Date.now()};
  db.books.push(b);save();ui.err='';ui.bookId=b.id;ui.startPage=1;
  ui.notice=ui.view==='books'?'Buku tersimpan. Buka tab Beranda untuk memilih goal dan mulai timer.':'Buku tersimpan. Sekarang pilih goal dan mulai timer.';
  render();
}
function deleteBook(id){
  if(db.sessions.some(function(s){return s.bookId===id;}))return;
  if(!confirm('Hapus buku ini dari daftar?'))return;
  db.books=db.books.filter(function(b){return b.id!==id;});save();render();
}

/* ====== Timer ====== */
function stopTick(){if(tickTimer){clearInterval(tickTimer);tickTimer=null;}}
function startTick(){stopTick();tickTimer=setInterval(tick,250);tick();}
function tick(){
  var a=db.active;if(!a||a.stoppedAt)return;
  var now=Date.now(),el=elapsedMs(a,now),goalMs=a.goalMin?a.goalMin*60000:0;
  if(!a.lastSave||now-a.lastSave>5000){a.lastSeen=now;a.lastSave=now;save();}
  var t=document.getElementById('tm'),sub=document.getElementById('sub'),arc=document.getElementById('arc');
  if(!t)return;
  var over=goalMs&&el>=goalMs;
  if(goalMs&&!over){t.textContent=fmt(Math.ceil((goalMs-el)/1000)*1000);sub.textContent='sisa waktu';}
  else{t.textContent=fmt(el);sub.textContent=goalMs?'goal tercapai · lanjut membaca':'waktu membaca';}
  t.innerHTML=digitsHtml(t.textContent);t.classList.toggle('long',t.textContent.length>5);
  if(arc){
    var C=2*Math.PI*54,p=goalMs?Math.min(1,el/goalMs):0;
    arc.setAttribute('stroke-dashoffset',String(C*(1-p)));
  }
  if(over&&!a.goalHandled&&!reachedShown){
    reachedShown=true;beep();
    showModal(celebrateHtml(a),'celebrate-modal');
  }
}
function continueReading(){
  if(db.active){db.active.goalHandled=true;save();}
  closeModal();
}

  $nav.style.display=(ui.view==='timer'||ui.view==='finish')?'none':'flex';

  var tc=document.querySelector('meta[name=theme-color]');if(tc)tc.setAttribute('content',ui.view==='timer'?'#2B2420':'#FFFBEF');

    return '<button data-a="nav" data-v="'+x[0]+'" class="'+(ui.view===x[0]?'on':'')+'"'+(ui.view===x[0]?' aria-current="page"':'')+'>'+icon(x[2])+'<span>'+x[1]+'</span></button>';

  var banner=storageOK?'':'<div class="banner">Penyimpanan browser tidak tersedia (mode privat?). Data tidak akan tersimpan.</div>';

/* ====== Riwayat & Buku: semua diturunkan dari data yang sudah ada (tanpa field baru) ====== */
var LVCOL={1:'#ABC270',2:'#FEC868',3:'#FDA769',4:'#E8803F'};
function nkey(n){var d=new Date(n*86400000);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');}
function shortDate(k){var p=k.split('-');return (+p[2])+' '+MON[+p[1]-1];}
function minOf(sec){return sec>0?Math.max(1,Math.round(sec/60)):0;}
function durTxt(sec){return sec<60?sec+' dtk':Math.round(sec/60)+' mnt';}
// Awal perjalanan = tanggal paling awal dari buku yang ditambahkan atau sesi yang tercatat.
function journeyStart(today){
  var ks=db.sessions.map(function(s){return s.date;}).concat(db.books.map(function(b){return dkey(b.createdAt);}));
  ks=ks.filter(function(k){return /^\d{4}-\d\d-\d\d$/.test(k);}).sort();
  return ks.length?ks[0]:today;
}
function mapCells(today,dates){
  var start=journeyStart(today),t=dnum(today);
  var first=(t-dnum(start)<30)?Math.min(dnum(start),t):t-29,cells=[];
  for(var k=0;k<30;k++){
    var n=first+k,key=nkey(n),idx=dates.indexOf(key),st;
    if(key===today)st=idx>=0?'todayon':'today';
    else if(n>t)st='future';
    else st=idx>=0?'on':'missed';
    cells.push({key:key,st:st,lv:idx>=0?levelFor(idx+1).lv:0});
  }
  return cells;
}
function mapCard(today,dates){
  var cells=mapCells(today,dates),on=0,miss=0,fut=0,todayOn=false;
  var grid=cells.map(function(c){
    if(c.st==='on'||c.st==='todayon')on++;
    if(c.st==='missed')miss++;
    if(c.st==='future')fut++;
    if(c.st==='todayon')todayOn=true;
    var sty=c.lv?' style="background:'+LVCOL[c.lv]+'"':'';
    return '<i class="mc '+c.st+'"'+sty+'></i>';
  }).join('');
  var label='Peta 30 hari, '+shortDate(cells[0].key)+' sampai '+shortDate(cells[29].key)+': '+on+' hari aktif, '+miss+' hari terlewat, '+fut+' hari belum datang. Hari ini '+(todayOn?'sudah':'belum')+' membaca.';
  var leg=[1,2,3,4].map(function(l){return '<span><i class="sw" style="background:'+LVCOL[l]+'"></i>Level '+l+'</span>';}).join('')+
    '<span><i class="sw missed"></i>Terlewat</span><span><i class="sw now"></i>Hari ini</span><span><i class="sw fut"></i>Belum datang</span>';
  return '<section class="card"><h2>Peta hari aktif</h2><p class="sub">'+shortDate(cells[0].key)+' – '+shortDate(cells[29].key)+'</p>'+
    '<div class="mapgrid" role="img" aria-label="'+esc(label)+'">'+grid+'</div><div class="legend">'+leg+'</div></section>';
}
function chartCard(today,info){
  var secs={};db.sessions.forEach(function(s){secs[s.date]=(secs[s.date]||0)+s.durationSec;});
  var cols=[],max=info.goalMin,PH=96,t=dnum(today);
  for(var k=6;k>=0;k--){
    var n=t-k,key=nkey(n),m=minOf(secs[key]||0);
    cols.push({m:m,now:k===0,day:DAY[new Date(n*86400000).getUTCDay()]});

      (c.m>0?'<i class="bfill" style="height:'+Math.max(6,Math.round(c.m/max*PH))+'px"></i>':'<i class="bzero"></i>')+'</div>';
  }).join('');
  var labels=cols.map(function(c){return '<span'+(c.now?' class="now"':'')+'>'+c.day+'</span>';}).join('');
  var label='Menit baca 7 hari terakhir: '+cols.map(function(c){return c.day+' '+c.m;}).join(', ')+'. Target quest '+info.goalMin+' menit.';
  return '<section class="card"><h2>Menit baca 7 hari terakhir</h2>'+
    '<div role="img" aria-label="'+esc(label)+'"><div class="plot"><div class="bars">'+bars+'</div><div class="tline" style="bottom:'+Math.round(info.goalMin/max*PH)+'px"></div></div>'+

    '<div class="tleg"><span class="tdash"></span>Target quest hari ini: '+info.goalMin+' menit</div></section>';
}

  var msg=!db.books.length?'Tambah buku pertamamu, yuk!':info.isActive?'Mantap, hari ini beres!':'Ayo, '+info.goalMin+' menit saja hari ini!';
  var h='<header><div class="hdate">'+prettyDate(today)+'</div><h1 class="greet">Hai, '+esc(USER_NAME)+'!</h1></header>'+helpHtml()+stripHtml(info.dates,today);
  h+='<section class="hero"><div class="hero-top"><div class="mascot">'+mascotSvg(info.lv)+'</div><div class="bubble" role="status">'+esc(msg)+'</div></div>'+
     '<div class="hero-chips"><span class="pill">'+icon('flame')+streak(info.dates,today)+' hari</span>'+
     '<span class="pill">'+icon('book')+finishedCount()+'/'+TARGET_BOOKS+' buku selesai</span></div></section>';
  h+='<section class="card"><p class="gift">Hadiah ulang tahun</p><h2>Series buku baru</h2>'+
     '<div class="row between"><span class="countdown">'+cd+'</span><span class="muted">18 Des 2026</span></div>'+
     '<div class="bar" role="progressbar" aria-label="Hari aktif menuju target" aria-valuemin="0" aria-valuemax="'+TARGET_DAYS+'" aria-valuenow="'+Math.min(act,TARGET_DAYS)+'"><i style="width:'+pct+'%"></i></div>'+
     '<div class="row between muted"><span>'+act+' / '+TARGET_DAYS+' hari aktif'+bonus+'</span><span>'+pct+'%</span></div>'+
     (act>=TARGET_DAYS?'<div class="muted" style="margin-top:6px">Target tercapai — series buku baru layak kamu ambil</div>':'')+'</section>';
  h+='<section class="quest"><div class="qicon">'+icon('clock')+'</div><div class="qbody"><div class="qt">Quest hari ini'+(info.bonus?' · bonus':'')+'</div>'+
     '<div>Level '+info.lv+': baca <b>'+info.goalMin+' menit</b></div>'+
     '<div class="muted">Hari aktif ke-'+info.idx+'. Sesi lebih pendek tetap dihitung.</div></div>'+
     '<span class="qchip'+(info.met?' on':'')+'">'+(info.met?'Tercapai':'Belum')+'</span></section>';
  var ob=openBooks();
  if(!db.books.length){
    h+='<div class="card"><h2>Langkah 1: tambah buku</h2>'+bookForm()+'</div>';
  }else if(!ob.length){
    h+='<div class="card"><h2>Semua buku selesai 🎉</h2><p class="muted">Tambahkan buku baru di tab Buku.</p></div>';
  }else{
    if(!ui.bookId||!ob.some(function(b){return b.id===ui.bookId;})){ui.bookId=ob[0].id;ui.startPage=lastEnd(ob[0].id,db.sessions);}
    if(ui.startPage==null)ui.startPage=lastEnd(ui.bookId,db.sessions);
    if(ui.goal===null)ui.goal=info.goalMin;
    var b=bookById(ui.bookId);
    h+='<div class="card">'+noticeHtml()+'<h2>Pilih buku &amp; goal</h2><label>Buku</label><select id="sel">'+
      ob.map(function(x){return '<option value="'+x.id+'"'+(x.id===ui.bookId?' selected':'')+'>'+esc(x.title)+'</option>';}).join('')+'</select>'+
      '<label>Start page (dari '+b.total+' halaman)</label><input id="sp" type="number" inputmode="numeric" min="1" max="'+b.total+'" value="'+esc(ui.startPage)+'">'+
      '<label>Mau baca berapa menit?</label><div class="chips">'+GOALS.map(function(g){return '<button class="chip'+(ui.goal===g?' on':'')+'" data-a="goal" data-g="'+g+'">'+g+' mnt</button>';}).join('')+
      '<button class="chip'+(ui.goal===0?' on':'')+'" data-a="goal" data-g="0">Bebas</button></div>'+
      errHtml()+'</div><button class="primary cta" data-a="start">'+icon('play')+'Mulai membaca</button>';
  }
  return h;
}
function bookForm(){
  return '<label>Judul buku</label><input id="bt" type="text" autocomplete="off">'+
    '<label>Total halaman</label><input id="bn" type="number" inputmode="numeric" min="1">'+
    errHtml()+'<div style="margin-top:14px"><button class="primary cta" data-a="addbook">Simpan buku</button></div>';
}
function viewBooks(){
  var done=finishedCount();
  var h='<header><div class="hdate">'+(db.books.length?db.books.length+' buku · '+done+' selesai':'Rak bukumu masih kosong')+'</div><h1 class="greet">Buku</h1></header>'+noticeHtml();
  if(!db.books.length){
    h+='<div class="card empty"><div class="mascot">'+mascotSvg(2)+'</div><p>Belum ada buku.</p><div class="muted">Tambahkan buku fisik yang ingin kamu selesaikan, yuk!</div></div>';
  }
  h+=db.books.map(function(b){
    var p=bookProgress(b,db.sessions),pct=Math.min(100,Math.round(p/b.total*100)),n=db.sessions.filter(function(s){return s.bookId===b.id;}).length;
    var st=p>=b.total?['done','Selesai']:n>0?['read','Sedang dibaca']:['','Belum dimulai'];
    return '<article class="card bcard"><div class="row between"><h2>'+esc(b.title)+'</h2><span class="stchip '+st[0]+'">'+st[1]+'</span></div>'+
      '<div class="muted" style="margin-top:4px">hal. '+p+' dari '+b.total+'</div>'+
      '<div class="bar" role="progressbar" aria-label="Progres '+esc(b.title)+'" aria-valuemin="0" aria-valuemax="'+b.total+'" aria-valuenow="'+p+'"><i style="width:'+pct+'%"></i></div>'+
      '<div class="row between muted"><span>'+n+' sesi</span><span>'+pct+'%</span></div>'+
      (n===0?'<div style="text-align:right"><button class="danger" data-a="delbook" data-id="'+b.id+'">Hapus</button></div>':'')+'</article>';
  }).join('');
  h+='<details class="addbook"'+((!db.books.length||ui.err)?' open':'')+'><summary>'+icon('plus')+'Tambah buku</summary><div class="card">'+bookForm()+'</div></details>';
  return h;
}
function viewHistory(){
  var today=dkey(Date.now()),info=todayInfo(db.sessions,today),dates=info.dates;
  var totalSec=0;db.sessions.forEach(function(s){totalSec+=s.durationSec;});
  var h='<header><div class="hdate">Perjalanan '+TARGET_DAYS+' hari aktif</div><h1 class="greet">Riwayat</h1></header>';
  h+='<div class="stats3"><div class="st g"><b>'+dates.length+'</b><span>hari aktif</span></div>'+
     '<div class="st y"><b>'+minOf(totalSec)+'</b><span>menit baca</span></div>'+
     '<div class="st o"><b>'+streak(dates,today)+'</b><span>streak hari</span></div></div>';
  h+=mapCard(today,dates)+chartCard(today,info);
  h+='<div class="sech"><h2>Sesi terbaru</h2>';
  if(db.books.length>1){
    h+='<select id="hb" aria-label="Filter buku"><option value="">Semua buku</option>'+
      db.books.map(function(b){return '<option value="'+b.id+'"'+(ui.histBook===b.id?' selected':'')+'>'+esc(b.title)+'</option>';}).join('')+'</select>';
  }
  h+='</div>';
  var list=db.sessions.filter(function(s){return !ui.histBook||s.bookId===ui.histBook;}).sort(function(a,b){return b.endedAt-a.endedAt;});
  if(!list.length)return h+'<div class="card empty"><div class="mascot">'+mascotSvg(2)+'</div><p>Belum ada sesi. Yuk mulai 5 menit saja!</p></div>';
  h+=list.map(function(s){
    var b=bookById(s.bookId),met=s.durationSec>=s.questGoalMin*60;
    return '<article class="card scard"><div class="row between"><b>'+esc(b?b.title:'(buku dihapus)')+'</b><span class="badge '+(met?'ok':'no')+'">'+(met?'Quest tercapai':'Belum tercapai')+'</span></div>'+
      '<div class="smeta"><span>'+prettyDate(s.date)+'</span><span>'+durTxt(s.durationSec)+'</span><span>hal. '+s.startPage+'–'+s.endPage+' ('+(s.endPage-s.startPage)+' hal.)</span></div>'+
      (s.note?'<div class="note">'+esc(s.note)+'</div>':'')+'</article>';
  }).join('');
  return h;
}
function viewTimer(){
  var a=db.active,b=bookById(a.bookId),C=2*Math.PI*54;
  return '<div class="timerwrap"><div class="t-head"><div class="muted">Membaca</div><h2>'+esc(b.title)+'</h2><div class="muted">mulai dari hal. '+a.startPage+'</div></div>'+
    '<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="#4A3F37" stroke-width="3.9"/>'+
    '<circle id="arc" cx="60" cy="60" r="54" fill="none" stroke="#ABC270" stroke-width="3.9" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/></svg>'+
    '<div class="t"><div class="tdig" id="tm" role="timer">00:00</div><div class="muted" id="sub"></div></div></div>'+
    '<div class="muted">'+(a.goalMin?'Goal '+a.goalMin+' menit':'Mode bebas')+' · layar tetap menyala</div>'+
    '<div class="t-buddy"><div class="mascot breath">'+mascotSvg('calm')+'</div><div class="bubble sm">Pelan-pelan saja, kamu hebat!</div></div>'+
    '<button class="primary cta" data-a="finish">Selesai</button><button class="outline" data-a="discard">Buang sesi</button></div>';
}
function viewFinish(){
  var a=db.active,b=bookById(a.bookId);
  return '<div class="fin-head"><div class="mascot">'+mascotSvg(3)+'</div><div><h1>Selesai membaca</h1><div class="muted">Kerja bagus! Tinggal catat halamannya.</div></div></div>'+
    '<div class="card"><div class="muted">'+esc(b.title)+'</div><div class="big" style="font-size:2.4rem">'+fmt(elapsedMs(a,a.stoppedAt))+'</div></div>'+
    '<div class="card"><label>End page (dari '+b.total+' halaman, mulai '+a.startPage+')</label>'+
    '<input id="endp" type="number" inputmode="numeric" min="'+a.startPage+'" max="'+b.total+'" value="'+(ui.endPage||a.startPage)+'">'+
    '<label>Catatan (opsional)</label><textarea id="note" placeholder="Boleh dikosongkan"></textarea>'+errHtml()+
    '<div style="margin-top:14px"><button class="primary cta" data-a="submit">Submit</button></div>'+
    '<button class="textbtn" data-a="discard">Buang sesi</button></div>';
}

/* ====== Pemulihan sesi terputus ====== */
function checkRecovery(){
  var a=db.active;if(!a)return;
  if(a.stoppedAt){ui.view='finish';return;}
  var b=bookById(a.bookId);
  if(!b){db.active=null;save();return;}
  var gap=Math.max(0,Date.now()-(a.lastSeen||a.startedAt));
  var mins=Math.round(elapsedMs({startedAt:a.startedAt,pausedMs:a.pausedMs,stoppedAt:a.lastSeen||a.startedAt},0)/60000);
  ui.view='home';
  showModal('<h2>Ada sesi yang belum selesai</h2><p class="muted">"'+esc(b.title)+'" — tercatat berjalan sekitar '+mins+' menit sebelum terputus. Waktu saat terputus tidak dihitung.</p>'+
    '<button class="primary" data-a="resume">Lanjutkan</button><button data-a="endrec">Akhiri &amp; isi halaman</button>');
}
function resumeSession(){
  var a=db.active,now=Date.now();
  a.pausedMs=(a.pausedMs||0)+Math.max(0,now-(a.lastSeen||now));a.lastSeen=now;save();
  closeModal();unlockAudio();getLock();ui.view='timer';render();
}
function endRecovered(){
  var a=db.active;a.stoppedAt=a.lastSeen||Date.now();save();closeModal();ui.view='finish';render();
}

/* ====== Event ====== */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.getAttribute('data-a');
  if(a==='nav'){ui.view=el.getAttribute('data-v');ui.err='';ui.notice='';render();}
  else if(a==='help'){ui.help=!ui.help;render();}
  else if(a==='goal'){ui.goal=parseInt(el.getAttribute('data-g'),10);keepInputs();render();}
  else if(a==='start'){keepInputs();startSession();}
  else if(a==='finish')stopSession();
  else if(a==='continue')continueReading();
  else if(a==='discard')discardSession();
  else if(a==='submit')submitSession();
  else if(a==='addbook')addBook();
  else if(a==='delbook')deleteBook(el.getAttribute('data-id'));
  else if(a==='closeModal')closeModal();
  else if(a==='resume')resumeSession();
  else if(a==='endrec')endRecovered();
});
document.addEventListener('change',function(e){
  if(e.target.id==='sel'){ui.bookId=e.target.value;ui.startPage=lastEnd(ui.bookId,db.sessions);ui.err='';render();}
  else if(e.target.id==='hb'){ui.histBook=e.target.value;render();}
});
function keepInputs(){var sp=document.getElementById('sp');if(sp)ui.startPage=sp.value;}
document.addEventListener('visibilitychange',function(){
  var a=db.active;
  if(document.hidden){if(a&&!a.stoppedAt){a.lastSeen=Date.now();save();}}
  else if(a&&!a.stoppedAt&&ui.view==='timer'){getLock();tick();}
});
window.addEventListener('pagehide',function(){var a=db.active;if(a&&!a.stoppedAt){a.lastSeen=Date.now();save();}});

/* ====== Mulai ====== */
if(typeof document!=='undefined'&&document.getElementById('app')){
  $app=document.getElementById('app');$nav=document.getElementById('nav');$modal=document.getElementById('modal');
  db=load();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  checkRecovery();
  render();
}
</script>
</body>
</html>
